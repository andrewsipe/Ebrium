[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebrium"
version = "3.0.0"
description = "Normalize vertical metrics across font families (cap-height anchored)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Andrew Sipe" }
]
license = { text = "MIT" }
dependencies = [
    "fonttools>=4.40.0",
    "rich>=13.0.0",
    "brotli>=1.0.9",
]

[project.urls]
Homepage = "https://github.com/andrewsipe/ebrium"
Repository = "https://github.com/andrewsipe/ebrium"

[project.scripts]
ebrium = "ebrium.cli:main"

[tool.setuptools]
packages = ["ebrium", "FontCore"]

[tool.setuptools.package-dir]
"ebrium" = "ebrium"
"FontCore" = "FontCore"

[tool.setuptools.package-data]
ebrium = ["py.typed"]
